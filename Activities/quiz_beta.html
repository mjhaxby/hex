    .face-down {

  <script>

    // GLOBAL VARIABLES

    // consts:
    const maxTeams = 4

    // semi-consts
    var betStep = 1
    var usingHints = false

    // game:
    var questions = []
    var questionOrder = []
    var teams = []
    var numQuestionCards
    var categories = []   
    var categoryIndex = {} 
    var pointsAreDifferentPerCategory = true
    var pointsAreDifferentWithinCategories = false

    // elements:
    var gameArea
    var titleCard
    var questionBoard    
    var scoreBoard
    var dimmer

    // states:
    var currentTeam = null // object
    var currentQuestion = null // object
    var lastQuestion = null // object
    var currentCategoryName = '' // string
    var lastCategoryName = '' // string
    var returnToTeam = null // next team if out of sequence (eg passed to other teams to answer question)
    var fromTeam = -1 // team that initiated the current action (eg used lifeline)
    var teamUpTeam = null
    var anyTeamCanAnswer = false
    var anyTeamMCAnswers = []
    var teamsGotWrongAnswer = [] // teams to answer wrong, will get negative points if others skip
    var activeLifelines = []                       
    var usingLifelines = [] // at the end of the turn, these will be marked as used for the appropriate team
    var previewModeDemonstrated = false // once per game, make sure the preview lifeline is clear by bringing attention to the close button
    var currentBet = 1    

    // utils
    var animationMoveHolder = {}

    // events etc.
    var resizeButtons
    var countdownInterval

    function showTeamBuilder() {
      let teamBuilderEl = document.getElementById('teamBuilder')
      for (let i = 0; i < gameSettings.numTeams; i++) {
        teamBuilderEl.appendChild(makeTeamControls(i))
      }
      teamBuilderEl.appendChild(newElement('button', { id: 'newTeamBtn', class: 'add-button mini-button', onclick: 'addTeam(this)' }, icons.add))
      teamBuilderEl.appendChild(newElement('button', { id: 'teamOKBtn', class: 'ok-button mini-button', onclick: gameSettings.showTitleCard ? 'showTitleCard()' : 'startGame()' }, icons.ok))
    }

    function makeTeamControls(team = 0) {
      let teamName = gameSettings.text_team + ' ' + (team + 1)
      let color = getUnpickedTeamColors().shuffle()[0] // choose random color from those left
      if(color == undefined) color = 1 // fallback
      let wrapper = newElement('div', {
        id: 'teamControls_' + team,
        class: 'team-controls'
      })
      let name = newElement('input', {
        id: 'teamName_' + team,
        class: 'team-name',
        onchange: `teams[${team}].name = this.value`,
        value: teamName,
        maxlength: 20,
      })
      let deleteButton = newElement('button', {
        class: 'mini-button delete-button',
        onclick: 'deleteTeam(this)',
        disabled: (teams.length < 2),
        'data-team': team,
      }, icons.cross)
      let header = newElement('div', { class: 'team-header' }, [name, deleteButton])
      wrapper.appendChild(header)
      let buttonContainer = newElement('div', { class: 'team-button-container' })
      for (let i = 1; i <= 5; i++) {
        let button = makeTeamColorButton(team, i)
        if (i == color) {
          button.classList.add('selected')
        }
        buttonContainer.appendChild(button)
      }
      wrapper.appendChild(buttonContainer)
      // update the global values:
      teams[team] = new Team(team, teamName, color)

      // update all team remove buttons
      updateTeamDeleteButtons()

      return wrapper
    }

    function getUnpickedTeamColors(){
      let teamBuilder = document.getElementById('teamBuilder')
      let pickedColorButtons = teamBuilder.querySelectorAll('.team-button.selected')
      let pickedColors = Array.from(pickedColorButtons).map(button => parseInt(button.dataset.color))
      let unpickedColors = Array.from({ length: 5 }, (_, i) => i + 1).filter(color => !pickedColors.includes(color))
      return unpickedColors
    }

    function updateTeamDeleteButtons() {
      let teamRemoveButtons = document.querySelectorAll('.team-controls .delete-button')
      teamRemoveButtons.forEach(button => {
        button.disabled = (teams.length <= 2)
        console.log('Updated delete button for team ' + button.dataset.team + ', disabled: ' + button.disabled)
      })
    }

    function addTeam(btn) {
      let teamBuilderEl = document.getElementById('teamBuilder')
      let newTeamId = teams.length
      if (newTeamId >= maxTeams) {
        alert('You can only have up to ' + maxTeams + ' teams.')
        return
      }
      teamBuilderEl.insertBefore(makeTeamControls(newTeamId), btn)
      if (teams.length == maxTeams) {
        btn.disabled = true
      }
    }

    function deleteTeam(btn) {
      if (teams.length <= 2) {
        alert('Minimum two teams are required to play the game.')
        return
      }
      let teamId = parseInt(btn.dataset.team)
      let teamControls = document.getElementById('teamControls_' + teamId)
      if (teamControls) {
        teamControls.remove()
        teams.splice(teamId, 1)
        // update the ids of the remaining teams
        teams.forEach((team, index) => {
          let oldId = team.id
          team.id = index
          document.getElementById('teamControls_' + oldId).id = 'teamControls_' + team.id
          document.getElementById('teamName_' + oldId).id = 'teamName_' + team.id
          let buttons = document.querySelectorAll(`#teamControls_${team.id} .team-button`)
          buttons.forEach(button => {
            button.id = `teamButton_${team.id}_${button.dataset.color}`
            button.dataset.team = team.id
          })
        })
      }
      // re-enable the add button if we have less than max teams
      if (teams.length < maxTeams) {
        document.getElementById('newTeamBtn').disabled = false
      }
      updateTeamDeleteButtons()
    }

    function makeTeamColorButton(team = 0, color = 1) {
      let button = newElement('button', {
        id: 'teamButton_' + team + '_' + color,
        class: 'team-button color' + color,
        dataColor: color,
        dataTeam: team,
        onclick: `selectTeamColor(${team}, ${color})`
      })
      return button
    }

    function selectTeamColor(team, color) {
      var buttonsToSelect = []
      var buttonsToUnselect = []
      // find button to select
      buttonsToSelect.push(document.getElementById(`teamButton_${team}_${color}`))
      // find button to unselect
      let currentButton = document.getElementById(`teamButton_${team}_${teams[team].color}`)
      if (currentButton && teams[team].color !== color) {
        buttonsToUnselect.push(currentButton)
      }
      // check to see if another team already selected this color
      let teamToChange = false
      teams.forEach(teamInArray => {
        if (teamInArray.color == color && teamInArray.id != team) {
          teamToChange = teamInArray.id
        }
      })
      if (teamToChange !== false) {
        let otherBtn = document.getElementById(`teamButton_${teamToChange}_${color}`)
        if (otherBtn) buttonsToUnselect.push(otherBtn)
        let revertBtn = document.getElementById(`teamButton_${teamToChange}_${teams[team].color}`)
        if (revertBtn) buttonsToSelect.push(revertBtn)
        teams[teamToChange].color = teams[team].color
      }
      // apply selections
      buttonsToSelect.forEach(button => {
        if (button) button.classList.add('selected')
      })
      buttonsToUnselect.forEach(button => {
        if (button) button.classList.remove('selected')
      })
      // update in array
      teams[team].color = color
    }

    // QUIZ QUESTION
    function QuizQuestion(id, data) {
      this.id = id
      this.question = data[0].text
      this.image = data[0].image ? data[0].image : null
      this.answers = data[1].split(gameSettings.separator) // split by the separator defined in the settings
      this.traps = data[4] ? data[4].split(gameSettings.separator) : [] // split by the separator defined in the settings
      if (this.traps.length > 0) this.traps.shuffle() // shuffle in case there are more than we need      
      this.category = data[5] ? data[5].trim().toLowerCase() : '' // category of the question, default is empty
      this.points = data[2] ? parseInt(data[2]) : 1 // points for the question, default is 1
      if (isNaN(this.points)) this.points = 1 // if points is not a number, set it to 1
      this.hint = data[3] ? data[3] : '' // hint for the question, default is empty
      this.type = data[6] ? data[6] : 'default' // question type (local version of game.mode) TO DO: change to use select property once the table has been updated
      this.ingame = false
      this.answered = false
      this.discarding = false
      this.discarded = false
      this.clue = getInitials(this.answers[0])
      this.num = null // number according to order the question card is shown by (as opposed to its id)
      this.index = null // index in the questions array (will often be the same as num)
      this.el
      this.backEl = null // HTML element
      this.frontEl

      this.answerOptions = this.answers.concat(this.traps) // combine answers and traps
      if (this.answerOptions.length > 4) { // if there are more than four options, we will only take the first four
        this.answerOptions = this.answerOptions.slice(0, 4)
      } else if (this.answerOptions.length < 4) { // if there are less than four options, we will add empty strings to fill it up
        let attempts = 0
        while (this.answerOptions.length < 4 && attempts < (gameData.length * 5)) { // try to fill in all the four options, but don't go crazy
          attempts++
          let randomLine = gameData[Math.floor(Math.random() * gameData.length)]
          let randomAnswer = randomLine[1].split(gameSettings.separator)[0] // take the first answer from a random line
          if (!this.answerOptions.includes(randomAnswer)) { // avoid duplicates
            this.answerOptions.push(randomAnswer)
          }
        }
      }
      this.answerOptions.shuffle() // so that the first answer is not always the correct one      

      this.makeHTML = function (num) {
        let back = this.makeCardBack(num)
        let front = this.makeCardFront(num)
        let inner = newElement('div', { class: 'inner-card face-down left', id: 'innerCard_' + id })
        this.el = newElement('div', { class: 'question-card-wrapper', id: 'questionCardWrapper_' + id })
        inner.appendChildren([front, back])
        this.el.appendChild(inner)
        if (gameSettings.stackQuestionsByCategory && gameSettings.questionOrder == 'free') {
          this.el.classList.add('no-display')
        }
        return this.el
      }

      this.makeCardBack = function (num) {        
        this.backEl = newElement('div', { class: 'question-card back', id: 'questionBack_' + this.id, onclick: gameSettings.questionOrder == 'free' ? `questions[${this.id}].showQuestion()` : `questions[${this.id}].revealQuestion()` })
        if(gameSettings.questionOrder == 'free'){
          let innerBack = newElement('span', {}, gameSettings.showClues ? this.clue : num)
          this.backEl.appendChild(innerBack)
          if(gameSettings.showPoints){
            this.backEl.appendChild(availablePointsView(this.points))
          }
          if(this.hint && this.hint.trim() !== ''){
            let hintIcon = newElement('div', { class: 'hint-icon' }, icons.lifeline_hint)
            this.backEl.appendChild(hintIcon)
          }        
          if (gameSettings.imageClues){
            if(this.image){
              addImageToEl(this.backEl, this.image)
              this.backEl.classList.add('image-clue')
            }          
          }
        } else {
          let innerBack = newElement('span' , {class: 'category-header-text'}, this.category)
          this.backEl.appendChild(innerBack)
        }
        this.num = num
        return this.backEl
      }

      this.makeCardFront = function (num) {

        let questionText = newElement('div', { class: 'question-text' }, this.question)

        let hintText = newElement('div', { class: 'hint-text' }, this.hint)

        if (!this.hint || this.hint.trim() === '') {

      this.makeAnswerArea = function (id) {
        var answerArea = newElement('div', { class: 'answer-area' })
        // the content of the answer area will depend on the game mode or question type. If the game mode is present, this overrides the question type, except for MC, which is just modified.

          answerArea.appendChildren([answerInput, OKbtn])
        } else if (gameSettings.mode == 'faith' || (this.type == 'faith' && gameSettings.mode != 'present')) {
          if (gameSettings.wrongAnsBehav == 'nextTeam' || gameSettings.wrongAnsBehav == 'anyTeam'){
            let nextTeamBtn = newElement('button', { class: 'next-team-button text-button', onclick: `handleIncorrectAnswer(currentQuestion,null,{forcePassTeam: true})` }, gameSettings.wrongAnsBehav == 'nextTeam' ? gameSettings.text_surrender_next : gameSettings.text_surrender_any)
            answerArea.appendChild(nextTeamBtn)

          showAnswerBtn.setAttribute('onclick', `showAnswer(${id})`)
          answerArea.appendChild(showAnswerBtn)          
        } else if (gameSettings.mode == 'mc' || this.type == 'mc') {
          console.log(this.answerOptions)
          let answerButtons = this.answerOptions.map((ans, index) => {
            return newElement('button', { class: `answer-button text-button ${gameSettings.mode == 'present' ? 'present' : ''}`, onclick: `questions[${this.id}].checkAnswer('${ans.replace(/'/g, "\\'")}', this)`, dataQuestion: this.id, dataAnswer: ans }, newElement('span', { class: 'answer-button-text' }, ans))

          answerArea.appendChildren(answerButtons)

        }
        return answerArea
      }

      this.checkAnswer = function (answer, button = null, handleAnswer = true) {
        // THIS WAS AUTOGENERATED – give it a good check, don't assue it's right

        if((gameSettings.mode == 'mc' || this.type == 'mc') && anyTeamCanAnswer && handleAnswer){
          // if we're in multiple choice mode and any team can answer, we will handle this separately
          // however, if we're just checking for correctness (handleAnswer = false), we can proceed as normal
          answerAsAnyTeam(button)
          return
        }

        if(activeLifelines.includes('lifeline_teamUp') && teamUpTeam){
          usingLifelines.push('lifeline_teamUp') // mark as used at end of turn
        }

        let correct = false        
        if (gameSettings.mode == 'typing' || this.type == 'typing') {
          let input = this.el.querySelector('.answer-input')
          if (input.value.trim().toLowerCase() == this.answers[0].trim().toLowerCase()) {
            correct = true
          } else if (gameSettings.requiredSimilarity <= 100) {
            // check similarity
            let similarity = stringSimilarity(input.value.trim().toLowerCase(), this.answers[0].trim().toLowerCase())
            // console.log('Similarity:', similarity)
            if (similarity >= (gameSettings.requiredSimilarity / 100)){
              correct = true
          }
          } else {
            // check against other possible answers
            for (let i = 1; i < this.answers.length; i++) {
              if (input.value.trim().toLowerCase() == this.answers[i].trim().toLowerCase()) {
                correct = true
                break
              }
            }
          }        
        } else if (gameSettings.mode == 'mc' || this.type == 'mc') {
          correct = (answer == this.answers[0])
          if (anyTeamCanAnswer){
            if(button) button.classList.add('selected-any-team')
          } else {
            if(button) button.classList.add('selected')
          }
        }

        if (!handleAnswer) {
          return correct
        }

        if (correct) {
          handleCorrectAnswer(this, answer)
          if (anyTeamCanAnswer) {
            this.el.classList.add('show-any-team-ok')
          }
        } else {
          handleIncorrectAnswer(this, answer)
        }
      }

        }

        // console.log('Showing question', this.id)                 
        dimmer.classList.add('active') // show dimmer

          team.currentAttempts = 0 // reset attempts for all teams
        })        
        let allCards = Array.from(document.querySelectorAll('.question-card-wrapper'))
        let inner = this.el.firstChild
        let wrapper = this.el
        if(gameSettings.questionOrder == 'free'){          
          allCards.forEach(card => {

            // card.style.opacity = 0 // hide all cards to avoid rendering issues
          })
        }
        wrapper.classList.add('centred')
        wrapper.classList.remove('complete')
        setTimeout(function () {
          if(gameSettings.questionOrder == 'free'){    
            allCards.forEach(card => {
              // card.style.opacity = 1 // show all cards again             
              animateMoveElementToNewPosition(card, card.id == wrapper.id)   // the wrappers     
              // animateMoveElementToNewPosition(wrapper)    
            })
          }
          inner.classList.remove('face-down', 'left', 'right')                 
          inner.classList.add('face-up') // in free question order or same category mode, show the front
          if (newCategory) { // in sequential mode, check if category has changed
            inner.classList.add('face-down') // if category has changed, show back first
          }
        }, 1)
        // make sure question text fits
        let questionText = this.el.querySelector('.question-text')
        if (questionText) {
          shrinkTextToFit(questionText, 0.95, 10, questionText.parentElement)
        }
        // if multiple choice mode, make sure the text fits the buttons
        if (gameSettings.mode == 'mc' || this.type == 'mc') {
          let answerButtons = Array.from(this.el.querySelectorAll('.answer-button-text'))
          answerButtons.forEach(buttonText => {
            shrinkTextToFit(buttonText, 0.95)
          })
          // set event listeners to shrink text if window resized
          resizeButtons = window.addEventListener('resize', () => {
            answerButtons.forEach(buttonText => {
              shrinkTextToFit(buttonText, 0.95)
            })
          })
        }

        // apply lifelines if any relevant ones are active
        if (activeLifelines.includes('lifeline_50_50')) {
          this.apply50_50Lifeline()          
        }
        if (activeLifelines.includes('lifeline_hint') && this.hint && this.hint.trim() != '') {
          // won't apply the hint if there isn't one, so the lifeline won't be wasted
          this.applyHintLifeline()
          // TO DO: when activating the hint lifeline from the main screen, show which questions have hints
        }
        if (activeLifelines.includes('lifeline_preview')) {
          if (!previewModeDemonstrated) {
            // make sure the user knows how to exit preview mode the first time
            let backBtn = this.el.querySelector('.back-button')
            if (backBtn) {
              backBtn.style.animation = 'getAttention 1.5s ease-in-out 1 .75s' // animate the back button to get attention
              previewModeDemonstrated = true
            }
          }
        }
        if (activeLifelines.includes('lifeline_oneLetter')) {
          this.applyOneLetterLifeline()
        }

        if(gameSettings.questionOrder == 'sequential'){
          let skipToList = document.getElementById('skipToQuestionsList')
          skipToList.value = this.id // update skip to question selector to current question
        }

        if(gameSettings.timePerQuestion > 0 && !newCategory){
          let delay = gameSettings.questionOrder == 'sequential' ? 2000 : 0; // slight delay before starting countdown in sequential mode
          setTimeout(() => {            
            startCountdown(gameSettings.timePerQuestion)
          }, delay)
        }

      }

      this.revealQuestion = function () {

      this.apply50_50Lifeline = function(){
        // if 50-50 lifeline is active, remove two incorrect options
          if (gameSettings.mode == 'mc' || this.type == 'mc') {
            let answerButtons = Array.from(this.el.querySelectorAll('.answer-button'))
            let incorrectButtons = answerButtons.filter(button => !this.answers.includes(button.textContent))
            incorrectButtons.shuffle()
            incorrectButtons.slice(0, 2).forEach(button => {
              button.disabled = true
              // button.style.visibility = 'hidden' // hide the button
            })           
          } else { // if typing or faith mode,
            let messageArea = this.el.querySelector('.message-area')
            if (messageArea) {
              messageArea.classList.add('hidden')
              let choices = [this.answers[0]]
              if (this.traps.length > 0){
                // ideally use one of the traps if available (at random)
                choices.push(this.traps[Math.floor(Math.random() * this.traps.length)]) 
              } else {
                // otherwise, we will go through a long process of finding something that looks similiar to the right answer
                let wrongAnswer = this.pickClosestWrongAnswers(1)
                if (wrongAnswer.length > 0){
                  choices.push(wrongAnswer[0])
                } else {
                  choices.push('banana') // fallback
                }
                let questionHeader = this.el.querySelector('.question-card-header')
                setTimeout(() => {
                  // make sure question text still fits (after animations)
                  if (questionHeader) {
                    shrinkTextToFit([questionHeader,messageArea], 0.95, 10, questionHeader.parentElement)
                  }
                  messageArea.classList.remove('hidden')
                },500)
              }
              messageArea.innerHTML = choices.join(' • ')
            }

          }
          usingLifelines.push('lifeline_50_50') // mark as being used for this turn
      }

      this.pickClosestWrongAnswers = function(numberToPick = 1){
        // This function will try to find an incorrect answer that is as similar as possible to the correct one        
        let questionsToPickFrom
        let closestAnswers = []
        if (categories.length > 1){
          // if categories are defined, we will only take unanswered questions from the same category as they're more likely to be similar/tricky
          questionsToPickFrom = questions ? questions.filter(q => q.category == this.category.title && !q.answered && !q.hidden && q.id != this.id) : []
        }
        // if this didn't yield anything, or there are no categories defined, just take from all unanswered questions
        if (categories.length <= 1 || questionsToPickFrom.length == 0 || questionsToPickFrom.length < numberToPick + 1){
          questionsToPickFrom = questions ? questions.filter(q => !q.answered && !q.hidden && q.id != this.id) : []

          if ( questionsToPickFrom.length < questionsToPickFrom.length/10 || questionsToPickFrom.length < numberToPick + 1){
            // if there are less than 10% or not enough to pick from, include answered ones too
            questionsToPickFrom = questions ? questions.filter(q => q.id != this.id) : []
          }
        }

        // get all answers from all questions that aren't duplicates of this one
        let incorrectAnswers = []
        questionsToPickFrom.forEach(q => {
          // Get answers that are not in this.answers
          let filtered = q.answers.filter(ans => !this.answers.includes(ans))
          incorrectAnswers.push(...filtered) // append all items to incorrectAnswers
        })        

        if (incorrectAnswers.length > 0){
          for (let i = 0; i < incorrectAnswers.length; i++){
            let simil = stringSimilarity(this.answers[0], incorrectAnswers[i])
            closestAnswers.push({simil: simil, answer: incorrectAnswers[i]})
            closestAnswers.sort((a,b) => b.simil - a.simil) // sort descending by similarity
            if (closestAnswers.length > numberToPick){
              closestAnswers = closestAnswers.slice(0, numberToPick) // keep only the top N
            }
            if(closestAnswers.length == numberToPick && closestAnswers[0].simil >= 0.75 && closestAnswers[numberToPick - 1].simil >= 0.25){
              // if we have enough very similar answers, stop looking
              break
            }
          }           
        }
        if (closestAnswers.length < numberToPick) {
          for (let i = 0; i < numberToPick - closestAnswers.length; i++){
            // fill in with dummy anagram answers made from correct ones
            let dummyAnswer = this.answers[Math.floor(Math.random() * this.answers.length)]
            closestAnswers.push({simil: 0, answer: dummyAnswer.split('').shuffle().join('')})
          }
        }
        return closestAnswers.map(obj => obj.answer)
      }
    }

            category.questions.push(questions[index])

    function makeCategoryCards(){

    function addQuestions(){
       if (gameSettings.questionsSelection == 'all'){
        if(categories.length > 1 && gameSettings.questionOrder == 'free'){
          // if categories are defined, we will only take questions from those categories
          categories.forEach(category => {
            addQuestionsFromCategory(category.title)
          })
        } else {
          let questionOrderIndices = Array.from(Array(questions.length).keys()) // array of question indices
          if (gameSettings.shuffle) questionOrderIndices.shuffle() // shuffle the order
          questionOrderIndices.forEach((qIndex, index) => {
            questions[qIndex].num = index + 1
            questions[qIndex].index = index
            questions[qIndex].ingame = true
            questionBoard.appendChild(questions[qIndex].makeHTML(questions[qIndex].num))
            questionOrder.push(questions[qIndex])
          })
          numQuestionCards = questions.length
        }
       } else if (gameSettings.questionsSelection == 'limited'){
        if (categories.length > 1){
          categories.forEach(category => {
            addQuestionsFromCategory(category.title, -1, gameSettings.numQuestions)
          })
        } else {
          let questionOrderIndices = Array.from(Array(questions.length).keys()) // array of question indices
          if (gameSettings.shuffle) questionOrderIndices.shuffle() // shuffle the order
          numQuestionCards = 0
          for (let i = 0; i < questionOrderIndices.length; i++) {
            let qIndex = questionOrderIndices[i]
            questions[qIndex].num = numQuestionCards + 1
            questions[qIndex].index = index
            questions[qIndex].ingame = true
            questionBoard.appendChild(questions[qIndex].makeHTML(questions[qIndex].num))
            questionOrder.push(questions[qIndex])
            numQuestionCards++
            if (numQuestionCards >= gameSettings.numQuestions) break // stop if we reached the limit
          }
        }
       }
      //  TO DO: REST OF OPTIONS

      // make category headers fit
      let categoryHeaders = Array.from(document.querySelectorAll('.category-header'))
      categoryHeaders.forEach(header => {
        shrinkTextToFit(header.firstChild, 0.9)
      })

      if(gameSettings.questionOrder == 'sequential'){
          let skipToDiv = document.getElementById('skipToQuestions')
          let skipToList = document.getElementById('skipToQuestionsList')
          questions.forEach(question => {
            let skipToOption = question.makeOptionEl()
            skipToList.appendChild(skipToOption)
          })
          skipToDiv.classList.remove('no-display')
      }
    }    

    function addQuestionsFromCategory(category, numQuestions = -1, totalQuestions = -1){    
      let categoryQuestions = questions.filter(q => q.category.toLowerCase() == category.toLowerCase())
      let numQuestionsInCategory = categoryQuestions.length
      if (numQuestions > 0 && numQuestions < numQuestionsInCategory){
        // if a specific number of questions is requested, and there are more questions in this category than that, we will limit it
        numQuestionsInCategory = numQuestions
      }
      if (totalQuestions > 0){
        // calculate how many questions to take from this category (proportional)
        numQuestionsInCategory = Math.ceil(numQuestionsInCategory/totalQuestions) // number of questions to take from this category
        if (numQuestionsInCategory + numQuestionCards > totalQuestions){
          // if it's the last category, it's possible that we will exceed the total number of questions due to rounding
          numQuestionsInCategory = totalQuestions - numQuestionCards // adjust to not exceed total
        }
      }
      if (categoryQuestions.length == 0) return // no questions in this category

      let categoryWrapper = newElement('div', {class:'category-wrapper'}, newElement('div', {class:'category-header'}, newElement('span',{'category-header-text': ''},category)))
      let questionOrder = Array.from(Array(categoryQuestions.length).keys()) // array of question indices
       if (gameSettings.shuffle) questionOrder.shuffle() // shuffle the order

      questionOrder.forEach((qIndex, index) => {
        let question = categoryQuestions[qIndex]
        question.num = qIndex + 1 + (numQuestionCards ? numQuestionCards : 0) // set the number according to the overall order
        categoryWrapper.appendChild(question.makeHTML(question.num))
        question.ingame = true
        if (index + 1 >= numQuestionsInCategory) return // stop if we reached the limit for this category
      })
      questionBoard.appendChild(categoryWrapper)
      numQuestionCards += categoryQuestions.length
    }

    function nextQuestion(specificQuestion = null){ // for sequential and random mode      
      let currentIndex = lastQuestion ? lastQuestion.index : -1
      let newQuestion
      if (specificQuestion){
        newQuestion = specificQuestion
      } else {
        newQuestion = currentIndex + 1 < questionOrder.length ? questionOrder[currentIndex + 1] : null
      }
      if (newQuestion != null){
        // hide question is already handled
        newQuestion.showQuestion()  
      } else {
        endGame()
      }
    }

    function previousQuestion(){ // for present mode
      // to do: handle categories
      let currentIndex = currentQuestion ? currentQuestion.index : questions.length
      let newQuestion = currentIndex >= 1 ? questionOrder[currentIndex - 1] : null
      currentQuestion.answered = false // mark as unanswered again
      if (newQuestion != null){
        currentQuestion.hideQuestion()
        newQuestion.showQuestion()

    function nextTeam(temporary=false, setTo = null){

      if(gameSettings.mode == 'present'){
        // in present mode, we don't change teams as there are none
        return
      }

      if (temporary && !returnToTeam){
        // if temporary, remember what should have been the next team, if not already set
        returnToTeam = currentTeam.next()
        fromTeam = currentTeam.id // to be safe, we'll remember the index of the team we moved from (less chance of errors)
      }

      // finalize lifelines used by last team
      if (!temporary){
        anyTeamCanAnswer = false // reset
        document.body.classList.remove('any-team')

        // get the last team
        let lastTeam
        if(fromTeam > -1){
          lastTeam = teams[fromTeam]
          // if we were temporarily moved from a team, reset
          fromTeam = -1
        } else {
          lastTeam = currentTeam
        }
        usingLifelines.forEach(lifeline => {
          lastTeam.usedLifelines[lifeline] = true // mark the lifelines used this turn as used
        })
        usingLifelines = [] // reset
        activeLifelines = [] // reset
        document.body.classList.remove('preview-mode')
        document.body.classList.remove('indicate-hints')    
      }

      if (numRemainingQuestions() > 0){
        // change to next team
        if(returnToTeam && !temporary){
          // if we moved to other teams temporarily, we should have retained the actual next team
          currentTeam = returnToTeam
          returnToTeam = null // reset
        } else {
          if (setTo){
            currentTeam = setTo
          } else {
            if(!currentTeam){
              currentTeam = teams[0] // if no current team, set to first team
            } else {   
              currentTeam = currentTeam.next()
            }
          }
        }
        if(!temporary){
          updateScores()
          if (gameSettings.lifelines){
            showCurrentTeamsLifelines()
          }
          // reset bets
          if (gameSettings.bettingMode){
              // currentBet = 1 // reset bet to 1
              // let betInput = document.getElementById('betInput')
              // if(betInput) betInput.value = currentBet
              updateBet(betStep)
            }
        }
        document.body.classList.remove('current-team0','current-team1','current-team2','current-team3','current-team4', 'current-color1', 'current-color2', 'current-color3', 'current-color4', 'current-color5')

    function establishPoints(question){
      let points = question.points
      if (gameSettings.bettingMode){        
        if (gameSettings.pointsAreMultipliers){
          points = question.points * currentBet
        } else {
          points = currentBet
        }
      }
      if (activeLifelines.includes('lifeline_2x')){
        points = points * 2
        usingLifelines.push('lifeline_2x') // mark as being used for this turn
      }
      return points
    }

    function handleCorrectAnswer(question,answer, options={awardingTeam: null,shareTeams:[]}) {
      
      if (gameSettings.mode != 'present'){

        // START of normal answer handling

        // set options
        if (options.hasOwnProperty('awardingTeam') && options.awardingTeam !== null){
          var awardingTeam = options.awardingTeam // probably don't need this?
          // if an awarding team is specified, use that instead of the current team
          currentTeam = teams[awardingTeam]
        } else {
          var awardingTeam = null
        }
        if (options.hasOwnProperty('shareTeams') && options.shareTeams.length > 0){
          var shareTeams = options.shareTeams
        } else {
          var shareTeams = []
        }

        question.frontEl.classList.remove('incorrect')
        question.backEl.classList.remove('incorrect')
        question.frontEl.classList.add('correct')
        question.backEl.classList.add('correct')
        question.backEl.classList.add('team-' + currentTeam.color)    

        let input = question.el.querySelector('input')
        if (input) input.disabled = true // disable input so not to change answer accidentally or resubmit

        let points = establishPoints(question)
        if ((!activeLifelines.includes('lifeline_teamUp') || !teamUpTeam) && shareTeams.length == 0){
          // if team up lifeline not used, or no team selected, give points to current team
          currentTeam.score += points
        } else if (activeLifelines.includes('lifeline_teamUp') && teamUpTeam) {
          // if team up lifeline used, give points to both teams (half each, rounded up for current team and down for other team)
          currentTeam.score += Math.ceil(points/2)
          teamUpTeam.score += Math.max(Math.floor(points/2),1) // at least 1 point each             
          teamUpTeam = null // reset
        }  else if (shareTeams.length > 0){
          // if there are teams sharing the points, apply it to them equally
          shareTeams.forEach(team => {
            team.score += Math.max(Math.floor(points/shareTeams.length),1) // at least 1 point each
          })
        } 

        // END of normal answer handling
        
      } else {
        question.backEl.classList.add('complete')
        question.el.classList.add('complete') // for sequential and random mode
      }

      // common handling for all modes include presentation mode
      
      question.answered = true // mark the question as answered

      if(anyTeamCanAnswer && (gameSettings.mode != 'mc' && currentQuestion.type != 'mc') && !question.el.classList.contains('show-team-ok')){
        question.el.classList.add('show-team-ok')               
      } else {
        setTimeout(() => {
          question.hideQuestion()
          if (gameSettings.questionOrder == 'sequential'){
            setTimeout(() => {
              nextQuestion()
            },100)
          }
          nextTeam()
        },1000)
      }
    }


    function handleIncorrectAnswer(question,answer=null,options={forceDiscard: false, forcePassTeam: false, shareTeams:[]}) {

      // set options
      if (options.hasOwnProperty('forceDiscard')){
        var forceDiscard = options.forceDiscard
      } else {
        var forceDiscard = false
      }
      if (options.hasOwnProperty('forcePassTeam')){
        var forcePassTeam = options.forcePassTeam
      } else {
        var forcePassTeam = false
      }
      if (options.hasOwnProperty('shareTeams')){
        var shareTeams = options.shareTeams
      } else {
        var shareTeams = []
      }

      if (typeof question === 'number'){
        if (question < 0 || question >= questions.length) return // invalid question id
        question = questions[question]
      }
      // whatever happens, we will mark the question as incorrect (some behaviors will undo this in a second)
      question.frontEl.classList.add('incorrect')
      question.backEl.classList.add('incorrect')
      
      currentTeam.currentAttempts++
      if(currentTeam.currentAttempts >= gameSettings.maxAttempts || forceDiscard || shareTeams.length > 0){  

        // deal with points (only if not force discard, which is used after applying point changes)
        if(!forceDiscard){
          if (gameSettings.negativePoints){
            let points = establishPoints(question)
  
            if (shareTeams.length == 0){
              // if team up lifeline not used, or no team selected, give points to current team
              currentTeam.score -= points // deduct points if negative points is enabled             
            } else if(shareTeams.length > 0){
              // if there are teams sharing the penalty, apply it to them too
              shareTeams.forEach(team => {
                team.score -= Math.floor(points/shareTeams.length)
              })
            }
          } else if (gameSettings.bettingMode){
            // in betting mode, deduct the bet amount (almost the same behaviour as negative points, but slightly simplified)
            if (shareTeams.length == 0){
              currentTeam.score -= (gameSettings.pointsAreMultipliers ? question.points * currentBet : currentBet)
            } else if(shareTeams.length > 0){
              // if there are teams sharing the penalty, apply it to them too
              shareTeams.forEach(team => {
                team.score -= Math.floor((gameSettings.pointsAreMultipliers ? question.points * currentBet : currentBet)/shareTeams.length)
              })
            }
          } 
  
          // ensure no team has less than 1 point in betting mode
          if (gameSettings.bettingMode){
            if (currentTeam.score <= 0 && !shareTeams.includes(currentTeam)) currentTeam.score = 1 // don't allow less than 1 in betting mode or they can't play anymore
            if (shareTeams.length > 0){
              shareTeams.forEach(team => {
                if (team.score <= 0) team.score = 1
              })
            }
          }
         }
        // end of points handling


         if (gameSettings.wrongAnsBehav == 'discard' || forceDiscard) {
          // TO DO: show the answer first (option?)
          // Adapt this, add pause or button to continue
          // let answerArea = question.frontEl.querySelector('.answer-area')
          // answerArea.innerHTML = `<div class="correct-answer">Correct answer: ${question.answers[0]}</div>`
          question.answered = true // mark the question as answered
          question.showAnswer()

          // sequential mode: we need to move onto the next question here (hiding question and dealing with points etc. will get handled below)
          if (gameSettings.questionOrder == 'sequential'){
            setTimeout(() => {
              nextQuestion()
            }, (gameSettings.mode == 'faith' || question.type == 'faith') ? 100 : 1100) // in faith mode, or for faith questions, move on more quickly as they will have already seen the answer // TO DO?: make a "next question" button?
          }  

          if(gameSettings.mode == 'faith' || question.type == 'faith'){
            question.discarding = true
            question.hideQuestion() 
            // setTimeout(() => {
            //   question.discard() // if faith mode, discard immediately
            // }, 500)

            
          } else {
            // in other modes, need to show the answer first, then discard when closing
            setTimeout(() => {
              // question.hideQuestion()
              question.discarding = true
              question.el.classList.add('show-back')
              question.el.classList.add('discarding')
            }, 500)
          }
        } else if(gameSettings.wrongAnsBehav == 'nextTeam' && ((gameSettings.mode != 'faith' && question.type != 'faith') || forcePassTeam)){ // in faith mode, we will handle next teams with a separate button
          // check max attempts not reached on all teams
          if (teams.some(team => team.currentAttempts < gameSettings.maxAttempts)) {
            if (!teamsGotWrongAnswer.includes(currentTeam)){
              teamsGotWrongAnswer.push(currentTeam) // remember who got it wrong in case of skipping
              // (checking to see if they're already on the list – they might have been added if team up lifeline used)
            }
            
            if(activeLifelines.includes('lifeline_teamUp') && teamUpTeam){
              // if team up lifeline used, also mark the other team as having got it wrong
              teamsGotWrongAnswer.push(teamUpTeam)
              // we'll now ignore the team up team for the rest of this turn
              teamUpTeam = null // reset
              usingLifelines.push('lifeline_teamUp') // mark as used at end of turn
              activeLifelines = activeLifelines.filter(lifeline => lifeline != 'lifeline_teamUp') // remove from active lifelines              
            }

            nextTeam(true) // to do: if team up team was involved, skip them too (or at least make sure they're not the next ones)
            // TO DO: enable skip for negative points mode and betting mode so they can pass if they want
            removeIncorrectClass(question) // remove the incorrect class after 1 second
          } else {            
            handleIncorrectAnswer(question, answer, {forceDiscard: true}) // force discard if all teams reached max attempts
          }  
        } else if (gameSettings.wrongAnsBehav == 'nextTeam' && (gameSettings.mode == 'faith' || question.type == 'faith')) {
           // in faith mode, we will handle next teams with a separate button
           // therefore just continue as we would after all teams have had their attempts
           // to do: decide how to handle attempts in this mode? probably just disabled?           
            handleIncorrectAnswer(question, answer, {forceDiscard: true}) // force discard if all teams reached max attempts                  
        } else if (gameSettings.wrongAnsBehav == 'anyTeam' && ((gameSettings.mode != 'faith' && question.type != 'faith')|| forcePassTeam)) {        
          if (shareTeams.length == 0){
            // if no share teams, that means we're beginning the any teams process
            anyTeam()          
            removeIncorrectClass(question) // remove the incorrect class after 1 second               
          }
          // feedbackAnyTeamAnswers will handle the rest as it will also deal with any correct answers, so hiding the question and moving on will be done there
        } else if (gameSettings.wrongAnsBehav == 'anyTeam' && (gameSettings.mode == 'faith' || question.type == 'faith')){
          // in faith mode, we will handle any teams with a separate button
          // therefore just continue as we would after all teams have had their attempts
          // to do: decide how to handle attempts in this mode? probably just disabled?           
           handleIncorrectAnswer(question, answer, {forceDiscard: true}) // force discard if all teams reached max attempts
        } else if (gameSettings.wrongAnsBehav == 'return') {          
          question.hideQuestion()
          nextTeam() 
          removeIncorrectClass(question) // remove the incorrect class after 1 second       
        } else {
          // TO DO: handle other behaviors
          console.warn('Unknown behavior for incorrect answer:', gameSettings.wrongAnsBehav,'. Default to discard.')
          handleIncorrectAnswer(question, answer, {forceDiscard: true}) // force discard
        }
      } else {
        // TO DO: give them another chance
        removeIncorrectClass(question)
      }

    }

    function getInitials(s) {
      // anything that is written in brackets we will just discard
      var withoutBrackets = s.replace(/\(.+\)/g, "");
      // if any of the words in the string have puncutation in front of them, we don't want that (most likely brackets, but we'll cover all just in case)

    function getInitials(s) {
      // anything that is written in brackets we will just discard
      var withoutBrackets = s.replace(/\(.+\)/g, "");
      // if any of the words in the string have puncutation in front of them, we don't want that (most likely brackets, but we'll cover all just in case)
      var punctuationless = withoutBrackets.replace(/[.,\/#!$%\^&\*;:{}=\-_`~]/g, " "); // put in a space (seperate out hyphenated words)
      var finalString = punctuationless.replace(/\s{2,}/g, " ");
      if (finalString == '' || /^\s+$/.test(finalString)) { // just in case there is nothing left! (or nothing but whitespace)
        return ('?'); // give them something to work with
      };
      var words = finalString.split(' ');
      var initials = '';
      for (i = 0; i < words.length; i++) {
        initials = initials + words[i].charAt(0);
      };
      return initials.toUpperCase()

    }

    function updateBet(value){
      let intValue = parseInt(value)
      if (isNaN(intValue) || intValue < 1) intValue = 1
      if (currentTeam.score > 0){
        if (intValue > currentTeam.score) intValue = currentTeam.score // can't bet more than they have
      } else {
        // however, if they have 0 or less, we will allow them to bet the minimum (and potentially get more in debt!)
        if (intValue > betStep) intValue = betStep 
        // note that on the multiplier mode, they always have at least 1 point, so this won't be an issue
      }      
      currentBet = intValue // set in case changed

      let betDisplay = document.getElementById('currentBet')

  function updateTickerAnimation(tickerWidth) {
      let ss = document.styleSheets; // all stylesheets
      let rulename = 'ticker-kf'
      // method for updating animation from: https://stackoverflow.com/questions/29376053/changing-css-animation-in-javascript
      // Remove any CSS rules inserted by a previous call to this method
      for (let i = 0; i < ss.length; ++i) { // for each stylesheet...
        for (let j = ss[i].cssRules.length - 1; j > 0; j--) { // for each rule...
          if (ss[i].cssRules[j].name === rulename) { // does the name match?
            ss[i].deleteRule(j);
          }
        }
      }
      // ticker animation adapted from from https://nolte.io/a-continuous-image-ticker-built-with-pure-css
      document.styleSheets[0].insertRule(`@keyframes ${rulename} { 0% { transform: translate3d(0px, 0, 0); } 100% { transform: translate3d(-${tickerWidth}px, 0, 0); } }`)
      // console.log(`@keyframes ${rulename} { 0% { transform: translate3d(0px, 0, 0); } 100% { transform: translate3d(-${tickerWidth}px, 0, 0); } }`)
    }

    function prepareAffixes(){
      // transform prefix and suffix into objects so we only have to work out plural versions once
      gameSettings['pointsPrefix'] = prepareAffix(gameSettings['pointsPrefix'])

    function prepareAffix(affix){
      let singular = affix.replaceAll(/\(([^/]+)\/[^)]+\)/g, '$1') // take the first option from any (singular/plural) options
      singular = singular.replaceAll(/\([^)]+\)/g,'') // remove any remaining brackets and their contents
      let plural = affix.replaceAll(/\([^(]+\/([^)]+)\)/g, '$1') // take the second option from any (singular/plural) options
      plural = plural.replaceAll(/\(([^)]+)\)/g,'$1') // remove any remaining brackets but keep their contents
      return { s: singular, p: plural }
    }

    function pointsAffix(type='Suffix', points=1){

      }
    }

    function startCountdown(seconds){
      let countdownEl = document.getElementById('countdownTimer')
      let countdownTextEl = document.getElementById('countdownTimerText')
      if(countdownEl){
        countdownTextEl.textContent = formatTime(seconds)
        countdownEl.classList.add('active')
        setTimeout(function(){
          countdownInterval = setInterval(() => {
            seconds--
            if (seconds <= 0){
              clearInterval(countdownInterval)
              countdownEl.classList.remove('active')
              countdownTextEl.textContent = '00:00'
              // trigger time up event
              if(currentQuestion){
                currentQuestion.timeUp()
              }
            } else {
              countdownTextEl.textContent = formatTime(seconds)
            }
          }, 1000)
        },400) // small delay to complete all animations and show timer
      }
    }

    function pauseCountdown(){
      clearInterval(countdownInterval)      
      document.getElementById('countdownTimer').classList.add('paused')
    }

    function resumeCountdown(){
      document.getElementById('countdownTimer').classList.remove('paused')
      let countdownTextEl = document.getElementById('countdownTimerText')      
      let timeParts = countdownTextEl.textContent.split(':')
      if(timeParts.length == 2){
        let seconds = parseInt(timeParts[0]) * 60 + parseInt(timeParts[1])
        startCountdown(seconds)
      }
    }

    function stopCountdown(){
      let countdownEl = document.getElementById('countdownTimer')

        setTimeout(() => {
          countdownTextEl.textContent = '00:00'

    function formatTime(seconds){
      let mins = Math.floor(seconds / 60)
      let secs = seconds % 60
      return `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`
    }


    function elementPosition(element) {
      let rect = element.getBoundingClientRect()
      return { x: rect.x + window.scrollX, y: rect.y + window.scrollY }
    }

    function getCalculatedSizeWithoutPadding(element) {
      var cs = getComputedStyle(element);

      var paddingX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
      var paddingY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);

      var borderX = parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
      var borderY = parseFloat(cs.borderTopWidth) + parseFloat(cs.borderBottomWidth);

      // Element width and height minus padding and border
      elementWidth = element.offsetWidth - paddingX - borderX;
      elementHeight = element.offsetHeight - paddingY - borderY;
      var output = new Object();
      output = { width: elementWidth, height: elementHeight }
      return output
    }

    function animateMoveElementPrepare(el, opacity = false) {
      animationMoveHolder[el.id] = elementPosition(el)
      if (opacity) {
        el.style.display = 'inline-block'
      }
      // console.log(animationMoveHolder[el.id])
    }

    function animateMoveElementToNewPosition(element, aboveAll = true) {
      element.style.opacity = 0 // hide the element to avoid rendering issues
      // get original transforms
      // const currentTransform = window.getComputedStyle(element).transform.replace(/translate\([\d,%A-z]\)/,'')
      // Calculate the differences
      let originalPosition = animationMoveHolder[element.id]
      if (originalPosition) {
        let newPosition = elementPosition(element)
        let deltaX = originalPosition.x - newPosition.x; // Δx = x2 - x1
        let deltaY = originalPosition.y - newPosition.y; // Δy = y2 - y1            

        // Apply the transform to an element (to put it in its original position)
        element.classList.add('no-animation')
        element.style.transform = `translate(${deltaX}px, ${deltaY}px)`;
        element.style.opacity = null // reshow the element

        // console.log("Starting animation for", element.id);
        // console.log("Original position:", originalPosition);
        // console.log("New position:", newPosition);
        // console.log("Delta:", deltaX, deltaY);

        // temporarily adjust wrapper if in category to avoid issues with overflow
        let parent = element.parentElement;
        if (parent.classList.contains('category-wrapper')) {
          parent.classList.add('animating');
        }

        if (aboveAll) {
          element.style.zIndex = '9999'
        }
        element.offsetWidth // recalculate positions
        // remove transform (and opacity) to element after short delay        
        requestAnimationFrame(() => {
          element.classList.remove('no-animation')      
          element.style.transform = null          
          setTimeout(function () {
            //cancel any temporary changes
            element.style.zIndex = null
            element.style.display = null
            element.style.transform = null
            element.style.pointerEvents = null
            delete animationMoveHolder[element.id]
            if (parent.classList.contains('category-wrapper')) {
              parent.classList.remove('animating');
            }
          }, 800)
        })
      } else {
        console.warn('No original position found for element', element.id, 'in animationMoveHolder. Skipping animation.')        
      }
    }

    function shrinkTextToFit(elements, desiredPercent, minimumFontSize = 12, parentElement = null) {
      // shrink text size of element(s) until it fits within desired percent of parent element
      // if passing multiple elements, they will all be resized to the same size (based on the first element)
      if (!Array.isArray(elements)) {
        elements = [elements]
      }      
      elements.forEach(element =>{
        element.style = "" //reset from any previous changes
      })            
      // use first element for font size
      var newFontSize = window.getComputedStyle(elements[0]).getPropertyValue("font-size").replace('px','')

      let condition      
      let parentBoundingRect
      let parentMargin

      if (elements.length == 1){
        condition = function (){
          let parentHeight = parentElement ? parentElement.offsetHeight : elements[0].parentElement.offsetHeight
          let parentWidth = parentElement ? parentElement.offsetWidth : elements[0].parentElement.offsetWidth
          return (elements[0].offsetHeight > desiredPercent*parentHeight || elements[0].offsetWidth > desiredPercent * parentWidth)
        }
      } else if (!parentElement) {
        condition = function (){
          return elements.some(element => (element.offsetHeight > desiredPercent*element.parentElement.offsetHeight || element.offsetWidth > desiredPercent * element.parentElement.offsetWidth))
        }
      } else {
        // when specifying a parent, we will compare the edges of the elements to the parent edges
        parentBoundingRect = parentElement.getBoundingClientRect()
        parentMargin = (parentBoundingRect.height - (desiredPercent * parentBoundingRect.height))/2// use width as basis for margin
        console.log('parentMargin', parentMargin)
        condition = function (){
          return elements.some(element => {
            let elementBoundingRect = element.getBoundingClientRect()
            return (elementBoundingRect.top < parentBoundingRect.top + parentMargin || elementBoundingRect.bottom > parentBoundingRect.bottom - parentMargin || elementBoundingRect.left < parentBoundingRect.left + parentMargin || elementBoundingRect.right > parentBoundingRect.right - parentMargin)
          })
        }
      }

      while (condition() && newFontSize >= minimumFontSize) {
        newFontSize--
        if (newFontSize < minimumFontSize) { // if it get very small, force it to scroll instead
          elements.forEach(element=>{
            element.style.overflow = "scroll"            
          })
        } else {
        elements.forEach(element => {
          element.style.fontSize = newFontSize + 'px'
        })
        }
      }
      // element.style.height = desiredPercent * parentHeight
    }

        // from https://stackoverflow.com/questions/10473745/compare-strings-javascript-return-of-likely
    function stringSimilarity(s1, s2) {
      var longer = s1;
      var shorter = s2;
      if (s1.length < s2.length) {
        longer = s2;
        shorter = s1;
      }
      var longerLength = longer.length;
      if (longerLength == 0) {
        return 1.0;
      }
      return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }
    function editDistance(s1, s2) {
      s1 = s1.toLowerCase();
      s2 = s2.toLowerCase();

      var costs = new Array();
      for (var i = 0; i <= s1.length; i++) {
        var lastValue = i;
        for (var j = 0; j <= s2.length; j++) {
          if (i == 0)
            costs[j] = j;
          else {
            if (j > 0) {
              var newValue = costs[j - 1];
              if (s1.charAt(i - 1) != s2.charAt(j - 1))
                newValue = Math.min(Math.min(newValue, lastValue),
                  costs[j]) + 1;
              costs[j - 1] = lastValue;
              lastValue = newValue;
            }
          }
        }
        if (i > 0)
          costs[s2.length] = lastValue;
      }
      return costs[s2.length];
    }

    function newElement(tag, properties = {}, innerHTML = '') {
      let el = document.createElement(tag)

        if (propertyName == 'disabled' || propertyName == 'disabled' || propertyName == 'required') {
          el[propertyName] = properties[property] // for disabled, disabled and required, we need to set these differently            
        } else {

        }

      if (typeof innerHTML == 'string' || typeof innerHTML == 'number') {
        el.innerHTML = innerHTML
      } else if (Array.isArray(innerHTML)) {
        innerHTML.forEach(child => {
          el.appendChild(child)
        })
      } else {
        el.appendChild(innerHTML)

    function isElement(obj) { // from https://stackoverflow.com/questions/384286/how-do-you-check-if-a-javascript-object-is-a-dom-object
      try {
        //Using W3 DOM2 (works for FF, Opera and Chrome)
        return obj instanceof HTMLElement;
      }
      catch (e) {
        //Browsers not supporting W3 DOM2 don't have HTMLElement and
        //an exception is thrown and we end up here. Testing some
        //properties that all elements have (works on IE7)
        return (typeof obj === "object") &&
          (obj.nodeType === 1) && (typeof obj.style === "object") &&
          (typeof obj.ownerDocument === "object");
      }
    }

        function modern_SVG2CSS(SVG_input){	
      var safe_svg = SVG_input.replace('width="100%"','') // remove width property
        .replace(/#/g, "%23")
        .replace(/\?/g, "%3F") //probably don't have ? marks in SVG		
        .replace(/[\t\n\r]/gm,'') //remove tabs and new lines
        .replace(/\s\s+/g, ' ') //replace multiple spaces with a single space
        .replace(/'/g, '"') //replace single quotes with double
        .replace(/> </g, '><');
      
      return "url('data:image/svg+xml," + safe_svg + "')";
      //new approach: https://www.youtube.com/watch?v=6qSN50Qk_54	
    }

    Array.prototype.shuffle = function () {
      let currentIndex = this.length, randomIndex;

      // While there remain elements to shuffle.
      while (currentIndex > 0) {

        // Pick a remaining element.
        randomIndex = Math.floor(Math.random() * currentIndex);
        currentIndex--;

        // And swap it with the current element.
        [this[currentIndex], this[randomIndex]] = [
          this[randomIndex], this[currentIndex]];
      }
      return this
    }
