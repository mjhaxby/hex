<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP -->

    <title>hex preferences</title>
    <link rel="stylesheet" href="toggle-switch.css"> <!--Only works in its own style sheet-->
    <link rel="stylesheet" href="index.css">    
  </head>
  <body>
    <!-- User activities folder (remove from menu) -->
    <div class="settings-group">
      <h2>Custom User Activities</h2>
      <label for="userActivities">Path</label>
      <input type="text" id="userActivities" name="userActivities">
      <button id="chooseUserActivitiesPath">Choose Path</button>
      <button id="openUserActivitiesPath">Open Folder</button>
    </div>
    <div class="settings-group">
      <h2>Activity Creation</h2>
      <label for="enableMarkdown">Enable Markdown</label>
      <input type="checkbox" id="enableMarkdown" name="enableMarkdown">

      <label for="showAdvancedExport">Show advanced export options</label>
      <input type="checkbox" id="showAdvancedExport" name="showAdvancedExport">

      <label for="defaultActivity">Default activity</label>
      <select id="defaultActivity" name="defaultActivity">
      </select>

      <label for="visibleActivities">Show activities on list</label>
      <select id="visibleActivities" name="visibleActivities" multiple>
      </select>

      <!-- <label for="allowHtmlExport">Allow HTML in exported activity</label>
      <input type="checkbox" id="allowHtmlExport" name="allowHtmlExport"> -->

      <button id="resetScormMessage">Reset SCORM message</button>
      <button id="resetActivitySettingDefaults">Reset all activity setting defaults</button>
      <!-- To do: remove from menu -->
    </div>
  </body>
